<!DOCTYPE html>
<html lang="tr">
<head>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: manipulation;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameCanvas {
            display: block;
            background-color: #000;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, rgba(0,20,50,0.9) 0%, rgba(0,0,0,0.95) 100%);
            z-index: 100;
            color: white;
            text-align: center;
        }
        .menu-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #44AAFF;
            text-shadow: 0 0 10px #0066FF;
        }
        .btn {
            background: linear-gradient(to bottom, #0066FF, #0044CC);
            color: white;
            border: none;
            padding: 1rem 2rem;
            margin: 1rem;
            border-radius: 50px;
            font-size: 1.2rem;
            min-width: 200px;
            cursor: pointer;
        }
        #controls {

        }

        }

            position: absolute;
            top: 1rem;

            background: rgba(0, 102, 255, 0.7);
            color: white;
            border: none;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            font-size: 1.2rem;
            z-index: 50;
            display: none;
        }
        #gameInfo {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            flex-direction: column;

            color: white;
            font-size: 1.2rem;
            z-index: 50;
        }
        #lives, #scoreDisplay {
            background: rgba(0, 0, 0, 0.5);

<body>
    <canvas id="gameCanvas"></canvas>
    
    <button id="pauseBtn">⏸</button>
    
    <div id="gameInfo">
        <div id="lives">❤️❤️❤️</div>
        <div id="scoreDisplay">Score: 0</div>
    </div>

=== JAVASCRIPT KODU ===
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const pauseBtn = document.getElementById('pauseBtn');
        const livesDisplay = document.getElementById('lives');
        const scoreDisplay = document.getElementById('scoreDisplay');
        
        function resizeCanvas() {
            const aspectRatio = 9 / 14;
            let newWidth, newHeight;

            if (window.innerHeight / window.innerWidth > 1 / aspectRatio) {
                newWidth = window.innerWidth;
                newHeight = newWidth / aspectRatio;
            } else {
                newHeight = window.innerHeight;
                newWidth = newHeight * aspectRatio;
            }

            canvas.width = newWidth;
            canvas.height = newHeight;

            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        
        let gameActive = false;
        let gamePaused = false;
        let lives = 3;
        let score = 0;
        let language = 'English';
        let difficulty = 'Easy';
        
        const texts = {
            English: { start: 'START GAME', easy: 'EASY', normal: 'NORMAL', hard: 'HARD', language: 'LANGUAGE: ENGLISH', lives: 'Lives: ', score: 'Score: ', pause: 'PAUSED' },
            Turkish: { start: 'OYUNU BAŞLAT', easy: 'KOLAY', normal: 'NORMAL', hard: 'ZOR', language: 'DİL: TÜRKÇE', lives: 'Can: ', score: 'Skor: ', pause: 'DURAKLATILDI' }
        };
        
        const ship = {
            x: 0, y: 0, width: 40, height: 24, speed: 5, color: '#44AAFF', moveLeft: false, moveRight: false
        };
        
        let meteors = [];
        function createMeteor() {
            const sizes = { Easy: 22, Normal: 16, Hard: 10 };
            const speeds = { Easy: 2, Normal: 4, Hard: 7 };
            return { 
                x: Math.random() * canvas.width, 
                y: -30, 
                size: sizes[difficulty],
                speed: speeds[difficulty]
            };
        }
        
        let bullets = [];
        
        function drawShip() {
            ctx.fillStyle = ship.color;
            ctx.beginPath();
            ctx.moveTo(ship.x, ship.y - ship.height/2);
            ctx.lineTo(ship.x - ship.width/2, ship.y + ship.height/2);
            ctx.lineTo(ship.x + ship.width/2, ship.y + ship.height/2);
            ctx.closePath();
            ctx.fill();
        }
        
        function drawMeteors() {
            ctx.fillStyle = '#FF0000';
            meteors.forEach(meteor => { ctx.beginPath(); ctx.arc(meteor.x, meteor.y, meteor.size, 0, Math.PI * 2); ctx.fill(); });
        }
        
        function drawBullets() {
            ctx.fillStyle = '#00FF00';
            bullets.forEach(bullet => { ctx.fillRect(bullet.x, bullet.y, 5, 15); });
        }
        
        function drawLives() { livesDisplay.textContent = texts[language].lives + '❤️'.repeat(lives); }
        function drawScore() { scoreDisplay.textContent = texts[language].score + score; }
        
        function updateGame() {
            if (ship.moveLeft && ship.x - ship.width/2 > 0) ship.x -= ship.speed;
            if (ship.moveRight && ship.x + ship.width/2 < canvas.width) ship.x += ship.speed;
            
            meteors.forEach((meteor, index) => {
                meteor.y += meteor.speed;
                if (Math.abs(meteor.x - ship.x) < meteor.size + ship.width/2 && Math.abs(meteor.y - ship.y) < meteor.size + ship.height/2) {
                    meteors.splice(index, 1);
                    lives--;
                    drawLives();
                    if (lives <= 0) endGame();
                }
                bullets.forEach((bullet, bIndex) => {
                    if (Math.abs(meteor.x - bullet.x) < meteor.size + 5 && Math.abs(meteor.y - bullet.y) < meteor.size + 15) {
                        meteors.splice(index, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        drawScore();
                    }
                });
            });
            
            const spawnRates = { Easy: 0.015, Normal: 0.025, Hard: 0.04 };
            if (Math.random() < spawnRates[difficulty]) meteors.push(createMeteor());
            
            bullets.forEach((bullet, index) => { bullet.y -= 10; if (bullet.y < 0) bullets.splice(index, 1); });
        }
        
        function togglePause() {
            if (!gameActive) return;
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? "▶" : "⏸";
        }
        
        function endGame() {
            gameActive = false;
            gamePaused = false;
            menu.style.display = 'flex';
            pauseBtn.style.display = 'none';
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameActive) {
                if (!gamePaused) {
                    updateGame();
                }

                drawMeteors();
                drawBullets();
                drawShip();

                if (gamePaused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#44AAFF';
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(texts[language].pause, canvas.width/2, canvas.height/2);
                    ctx.textAlign = 'left';
                }
            }
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('leftBtn').addEventListener('touchstart', () => ship.moveLeft = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => ship.moveLeft = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => ship.moveRight = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => ship.moveRight = false);
        document.getElementById('shootBtn').addEventListener('click', () => { if (gameActive && !gamePaused) bullets.push({x: ship.x, y: ship.y - 30}); });
        pauseBtn.addEventListener('click', togglePause);
        
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                difficulty = this.id.replace('Btn', '').charAt(0).toUpperCase() + this.id.slice(1).replace('Btn', '');
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.getElementById('language-btn').addEventListener('click', () => { language = language === 'English' ? 'Turkish' : 'English'; updateUI(); });
        
        function updateUI() {
            const lang = texts[language];
            document.getElementById('startBtn').textContent = lang.start;
            document.getElementById('easyBtn').textContent = lang.easy;
            document.getElementById('normalBtn').textContent = lang.normal;
            document.getElementById('hardBtn').textContent = lang.hard;
            document.getElementById('language-btn').textContent = lang.language;
            drawLives();
            drawScore();
        }
        
        document.getElementById('startBtn').addEventListener('click', () => {
            gameActive = true;
            gamePaused = false;
            score = 0;
            lives = 3;
            meteors = [];
            bullets = [];
            menu.style.display = 'none';
            pauseBtn.style.display = 'block';
            pauseBtn.textContent = '⏸';
            resizeCanvas();
            updateUI();
        });
        
        resizeCanvas();
        updateUI();
        gameLoop();
    </script>
</body>
</html>

    <script>
        const sourceTextArea = document.getElementById('source-text');
        const uploadBtn = document.getElementById('upload-btn');
        const downloadBtn = document.getElementById('download-btn');

        // İndirme butonunu hazırla (sayfa yüklendiğinde)
        window.addEventListener('DOMContentLoaded', () => {
            // Textarea'daki metni al
            const textContent = sourceTextArea.value;
            
            // TXT dosyası oluştur
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            
            // İndirme linkini ayarla
            downloadBtn.href = URL.createObjectURL(blob);
            downloadBtn.download = 'kaynak.txt';
        });

        // Kopyala butonuna tıklandığında
        uploadBtn.addEventListener('click', () => {
            // Textarea'daki kodu seç
            sourceTextArea.select();
            sourceTextArea.setSelectionRange(0, 99999); // Mobil için

            try {
                // Clipboard API ile kopyala
                navigator.clipboard.writeText(sourceTextArea.value)
                    .then(() => {
                        uploadBtn.textContent = "✓ KOPYALANDI!";
                        uploadBtn.style.background = "linear-gradient(to bottom, #4CAF50, #45a049)";
                        
                        // 2 saniye sonra eski haline döndür
                        setTimeout(() => {
                            uploadBtn.textContent = "Kaynak Kodu KOPYALA";
                            uploadBtn.style.background = "linear-gradient(to bottom, #2ECC71, #27AE60)";
                        }, 2000);
                    })
                    .catch(err => {
                        // Fallback: eski yöntemle kopyalama
                        document.execCommand('copy');
                        alert('Kaynak kodu panoya kopyalandı!');
                    });
            } catch (err) {
                // En eski fallback
                document.execCommand('copy');
                alert('Kaynak kodu panoya kopyalandı!');
            }
        });

        // Textarea'ya tıklandığında otomatik seç
        sourceTextArea.addEventListener('click', function() {
            this.select();
        });
    </script>
